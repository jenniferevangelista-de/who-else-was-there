name: pages
# Publishes the game to GitHub Pages as a web demo on sample numbers.
# The live camera reading needs the desktop app, because the Presage SDK runs natively.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site/app _site/dist _site/node_modules/@fontsource
          cp -r app/renderer _site/app/
          cp dist/app.js _site/dist/
          for f in fredoka cormorant-garamond vt323; do
            mkdir -p _site/node_modules/@fontsource/$f
            cp -r node_modules/@fontsource/$f/files _site/node_modules/@fontsource/$f/
          done
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Ghost Hunt · Who Else Was There?</title>
          <meta name="description" content="Ghost Hunt is a cute, spooky game built on the Presage SmartSpectra SDK. Living faces have a heartbeat. The face that reads 0 beats per minute is the case. Play it in your browser, no install.">
          <meta http-equiv="refresh" content="0; url=app/renderer/index.html">
          <body style="background:#0e0718;color:#f4ecff;font:17px/1.6 system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px">
          <h1>Ghost Hunt · Who Else Was There?</h1>
          <p><a href="app/renderer/index.html" style="color:#ffd27a">Play it now in your browser, no install</a></p>
          <p>A cute, spooky game built on the Presage SmartSpectra SDK. Living faces have a heartbeat. The face that reads 0 beats per minute is the case. Seven SmartSpectra signals drive the game: pulse, chest movement, breathing rate, talking, blinks, expression and validation status.</p>
          <p>This web demo runs on tagged sample numbers. The live camera reading runs in the desktop app, because the Presage SDK is native. No frames are saved and no video is recorded. It is a game, not a medical device.</p>
          <p>Code and setup: <a href="https://github.com/jenniferevangelista-de/who-else-was-there" style="color:#ffd27a">github.com/jenniferevangelista-de/who-else-was-there</a></p>
          EOF
      # A test copy of the `next` branch at /next/, so a change can be tried on a phone before it replaces the game above.
      - uses: actions/checkout@v4
        with:
          ref: next
          path: next-src
        continue-on-error: true
      - name: Assemble the test copy
        run: |
          [ -d next-src/app ] || exit 0
          cd next-src && npm ci && npm run build && cd ..
          mkdir -p _site/next/app _site/next/dist _site/next/node_modules/@fontsource
          cp -r next-src/app/renderer _site/next/app/
          cp next-src/dist/app.js _site/next/dist/
          for f in fredoka cormorant-garamond vt323; do
            mkdir -p _site/next/node_modules/@fontsource/$f
            cp -r next-src/node_modules/@fontsource/$f/files _site/next/node_modules/@fontsource/$f/
          done
          printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>Ghost Hunt (test)</title><meta http-equiv="refresh" content="0; url=app/renderer/index.html">' > _site/next/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
