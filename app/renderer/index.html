<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: file:; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:;">
  <title>Ghost Hunt: Who Else Was There?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="sky" aria-hidden="true"></div>

  <header class="top">
    <div class="brand"><img class="beat" src="img/heart.svg" alt=""><b>Ghost Hunt · <span>Who Else Was There?</span></b></div>
    <span class="mode" id="mode" hidden>SAMPLE DATA</span>
    <div class="spacer"></div>
    <span class="pill" id="privacy" title="Nothing is recorded. Faces are blurred.">🔒 Nothing recorded</span>
    <button class="pill btn" id="camPill" aria-live="polite"><span class="dot"></span><span id="camText">Camera off</span></button>
  </header>

  <main id="stage"></main>

  <nav class="story" aria-label="Story">
    <button class="btn-soft" id="back">← Back</button>
    <div><div class="chapters" id="chapters"></div><div class="where" id="where"></div></div>
    <button class="btn-main" id="next">Next →</button>
  </nav>

  <div id="toast" role="status"></div>
  <script src="../../dist/app.js"></script>
</body>
</html>
